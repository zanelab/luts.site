<h1 class="h2 page-title">投稿审批</h1>

<div class="lut-admin" id="lut-admin">
  <p class="lut-admin-loading" id="lut-admin-loading">加载中…</p>

  <div class="lut-admin-denied" id="lut-admin-denied" hidden>
    <p id="lut-admin-denied-msg">此页面仅对管理员开放。</p>
    <div class="lut-admin-denied-hint" id="lut-admin-denied-hint" hidden>
      <p>你已登录为 <code id="lut-admin-denied-email"></code>，但该账号尚未被授予管理员权限。</p>
      <p>请在 Supabase Dashboard → SQL Editor 中执行：</p>
      <pre><code id="lut-admin-denied-sql"></code></pre>
    </div>
  </div>

  <div class="lut-admin-error" id="lut-admin-error" hidden>
    <p class="lut-admin-error-msg" id="lut-admin-error-msg"></p>
    <button type="button" class="btn btn-default" id="lut-admin-retry">重试</button>
  </div>

  <div class="lut-admin-content" id="lut-admin-content" hidden>
    <div class="lut-admin-tabs" role="tablist">
      <button type="button" class="lut-admin-tab" data-status="pending" role="tab">待审核</button>
      <button type="button" class="lut-admin-tab" data-status="approved" role="tab">已通过</button>
      <button type="button" class="lut-admin-tab" data-status="rejected" role="tab">已拒绝</button>
    </div>

    <ul class="lut-admin-list" id="lut-admin-list"></ul>
    <p class="lut-admin-empty" id="lut-admin-empty" hidden>暂无</p>
  </div>

  <div class="lut-admin-drawer" id="lut-admin-drawer" hidden aria-hidden="true">
    <div class="lut-admin-drawer-card">
      <button type="button" class="lut-admin-drawer-close" id="lut-admin-drawer-close" aria-label="关闭">×</button>
      <h3 class="lut-admin-drawer-title" id="lut-admin-drawer-title"></h3>
      <p class="lut-admin-drawer-meta" id="lut-admin-drawer-meta"></p>
      <p class="lut-admin-drawer-desc" id="lut-admin-drawer-desc"></p>
      <p class="lut-admin-drawer-tags" id="lut-admin-drawer-tags"></p>
      <p class="lut-admin-drawer-file" id="lut-admin-drawer-file"></p>
      <p class="lut-admin-drawer-link" id="lut-admin-drawer-link"></p>

      <div class="lut-admin-drawer-actions" id="lut-admin-drawer-actions">
        <button type="button" class="btn btn-primary" id="lut-admin-approve">Approve &amp; Publish</button>
      </div>

      <div class="lut-admin-reject" id="lut-admin-reject">
        <label for="lut-admin-reject-reason">拒绝原因（至少 10 字）</label>
        <textarea id="lut-admin-reject-reason" rows="3" maxlength="500"></textarea>
        <p class="lut-admin-counter"><span id="lut-admin-reject-count">0</span> / 500</p>
        <button type="button" class="btn btn-danger" id="lut-admin-reject-btn" disabled>确认拒绝</button>
      </div>

      <p class="lut-admin-drawer-status" id="lut-admin-drawer-status" aria-live="polite"></p>
    </div>
  </div>
</div>
