<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Blog post default cover">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2933"/>
      <stop offset="100%" stop-color="#0b1015"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="533" fill="url(#g)"/>
  <rect width="800" height="533" fill="url(#grid)"/>
  <g transform="translate(400,250)" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-60" y="-70" width="120" height="140" rx="8"/>
    <line x1="-40" y1="-40" x2="40" y2="-40"/>
    <line x1="-40" y1="-15" x2="40" y2="-15"/>
    <line x1="-40" y1="10" x2="40" y2="10"/>
    <line x1="-40" y1="35" x2="15" y2="35"/>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#ffffff" fill-opacity="0.6">BLOG</text>
</svg>
