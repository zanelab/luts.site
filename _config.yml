title: LUTs.site
description: 让每一位手机创作者，都能用最少的步骤，得到最想要的色彩。不用昂贵设备，不用苦学调色，一个LUT，几分钟，你的日常片段就能拥有电影般的情绪。
theme: null
plugins:
  - jekyll-sass-converter
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed
  sass_dir: _sass

exclude:
  - AGENTS.md
  - spec/
  - openspec/
  - .claude/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/

collections:
  pages:
    output: true
  luts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:slug.html