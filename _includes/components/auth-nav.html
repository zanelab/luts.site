<!--
  Auth-aware nav slot.

  Two-step OTP sign-in for admins:
    1. Email step:  user types email → signInWithOtp (shouldCreateUser: true)
    2. Code step:   6 independent digit inputs → verifyOtp (type: 'email')

  The JS lives in assets/js/auth-nav.js. The page must include
  assets/js/supabase-config.js (window.LUTSITE_*) BEFORE auth-nav.js runs.
  supabase-js@2 loads deferred from head-scripts.html. auth-nav.js is
  loaded with `defer` at the bottom of this partial so it runs after the
  config globals are defined.
-->
<div class="auth-nav" id="auth-nav">
  <div class="auth-nav-loading" hidden>...</div>

  <button type="button" class="auth-nav-signin btn btn-default" id="auth-nav-signin">
    登录
  </button>

  <div class="auth-nav-user" hidden>
    <button type="button" class="auth-nav-avatar" id="auth-nav-avatar" aria-haspopup="true" aria-expanded="false">
      <span class="auth-nav-initial">?</span>
    </button>
    <ul class="auth-nav-dropdown" id="auth-nav-dropdown" role="menu" hidden>
      <li class="auth-nav-admin" role="none" hidden>
        <a role="menuitem" href="/admin/submissions/">⚙ 审批</a>
      </li>
      <li class="auth-nav-admin" role="none" hidden>
        <a role="menuitem" href="/admin/luts/">⚙ LUT 管理</a>
      </li>
      <li role="none">
        <button type="button" role="menuitem" id="auth-nav-signout">退出</button>
      </li>
    </ul>
  </div>

  <div class="auth-nav-modal" id="auth-nav-modal" hidden>
    <div class="auth-nav-modal-card">
      <button type="button" class="auth-nav-modal-close" id="auth-nav-modal-close" aria-label="关闭">×</button>
      <h3 class="auth-nav-modal-title">管理员登录</h3>

      <!-- Step 1: email -->
      <div class="auth-nav-step" id="auth-nav-step-email">
        <p class="auth-nav-modal-help">输入管理员邮箱，我们会发送 6 位数字验证码。</p>
        <form id="auth-nav-email-form" novalidate>
          <input type="email" id="auth-nav-email" placeholder="admin@yourdomain.com" required autocomplete="email" />
          <button type="submit" class="btn btn-primary" id="auth-nav-email-submit">发送验证码</button>
        </form>
      </div>

      <!-- Step 2: 6-digit code -->
      <div class="auth-nav-step" id="auth-nav-step-code" hidden>
        <p class="auth-nav-modal-help">已向 <strong id="auth-nav-code-email"></strong> 发送验证码，请输入邮件中的 6 位数字。</p>
        <div class="auth-nav-code-row" id="auth-nav-code-row">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="auth-nav-code-input" aria-label="第 1 位" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="auth-nav-code-input" aria-label="第 2 位" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="auth-nav-code-input" aria-label="第 3 位" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="auth-nav-code-input" aria-label="第 4 位" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="auth-nav-code-input" aria-label="第 5 位" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="auth-nav-code-input" aria-label="第 6 位" />
        </div>
        <div class="auth-nav-code-actions">
          <button type="button" class="auth-nav-link" id="auth-nav-resend" disabled>重新发送 (60s)</button>
          <a href="#" class="auth-nav-link" id="auth-nav-change-email">换一个邮箱</a>
        </div>
      </div>

      <p class="auth-nav-modal-msg" id="auth-nav-modal-msg" aria-live="polite"></p>
    </div>
  </div>
</div>

<style>
  .auth-nav { position: fixed; top: 20px; right: 20px; z-index: 1500; }
  .auth-nav-signin.btn {
    background: none; border: 0; padding: 0;
    color: #fff; text-transform: uppercase;
    font-size: 12px; font-weight: 500; letter-spacing: .05em;
    opacity: 0.5;
    transition: opacity 0.3s ease, color 0.3s ease;
  }
  .auth-nav-signin.btn:hover, .auth-nav-signin.btn:focus-visible { opacity: 1; color: #ebb85e; }
  .auth-nav-user { position: relative; display: inline-block; margin-left: 12px; }
  .auth-nav-entry {
    display: inline-block;
    margin: 29px 0 0 15px;
    color: inherit; text-decoration: none;
    font-size: 12px; font-weight: 500; letter-spacing: .05em;
    text-transform: uppercase; opacity: 0.5;
    transition: opacity 0.3s ease, color 0.3s ease;
  }
  .auth-nav-entry:hover, .auth-nav-entry:focus-visible { opacity: 1; color: #ebb85e; text-decoration: none; }
  .auth-nav-entry:focus-visible { outline: 2px solid #ebb85e; outline-offset: 2px; border-radius: 2px; }
  .side-header .auth-nav-entry--side {
    display: block; margin: 18px 0 0; padding: 0;
    text-align: center; font-size: 12px;
  }
  .auth-nav-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: transparent; color: #fff;
    border: 1px solid rgba(255,255,255,0.3); cursor: pointer;
    font-size: 12px; font-weight: 500; line-height: 30px;
    text-align: center; padding: 0;
    transition: border-color 0.3s ease, color 0.3s ease;
  }
  .auth-nav-avatar:hover, .auth-nav-avatar:focus-visible {
    border-color: #ebb85e; color: #ebb85e;
  }
  .auth-nav-initial { display: block; }
  .auth-nav-dropdown {
    position: absolute; right: 0; top: calc(100% + 8px);
    min-width: 200px; background: #1a1a1a; color: #eee;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    list-style: none; padding: 6px 0; margin: 0;
    border-radius: 4px; z-index: 1000;
  }
  .auth-nav-dropdown[hidden] { display: none; }
  .auth-nav-dropdown li { display: block; }
  .auth-nav-dropdown a, .auth-nav-dropdown button {
    display: block; width: 100%; padding: 10px 18px;
    text-align: left; background: none; border: 0;
    color: rgba(255,255,255,0.75); text-decoration: none;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .auth-nav-dropdown a:hover, .auth-nav-dropdown button:hover {
    background: rgba(255,255,255,0.06); color: #ebb85e;
  }

  .auth-nav-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000;
  }
  .auth-nav-modal[hidden] { display: none; }
  .auth-nav-modal-card {
    position: relative; background: #1a1a1a; color: #eee;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    padding: 24px; border-radius: 6px; max-width: 380px; width: 92%;
  }
  .auth-nav-modal-close {
    position: absolute; top: 8px; right: 8px;
    background: none; border: 0; font-size: 24px; line-height: 1;
    cursor: pointer; color: rgba(255,255,255,0.6);
    width: 32px; height: 32px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .auth-nav-modal-close:hover {
    background: rgba(255,255,255,0.08); color: #fff;
  }
  .auth-nav-modal-title {
    margin: 0 0 8px; font-size: 16px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .auth-nav-modal-help {
    margin: 0 0 16px; color: rgba(255,255,255,0.6); font-size: 13px;
  }
  .auth-nav-step[hidden] { display: none; }
  .auth-nav-modal-card input[type="email"] {
    width: 100%; padding: 12px 14px; margin-bottom: 12px;
    background: #0e0e0e; color: #fff;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;
    font-size: 14px; box-sizing: border-box;
    outline: none; transition: border-color 0.15s ease;
  }
  .auth-nav-modal-card input[type="email"]:focus {
    border-color: rgba(255,255,255,0.4);
  }
  .auth-nav-modal-card .btn-primary {
    width: 100%; padding: 13px 20px;
    background: #ebb85e; color: #95680d;
    font-size: 13px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    border: none; border-radius: 4px; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .auth-nav-modal-card .btn-primary:hover:not(:disabled) {
    background: #2d2d2d; color: #ebb85e;
  }
  .auth-nav-modal-card .btn-primary:disabled {
    opacity: 0.45; cursor: not-allowed;
  }
  .auth-nav-modal-msg { margin: 8px 0 0; font-size: 13px; min-height: 1.2em; }
  .auth-nav-modal-msg.error { color: #ff8a8a; }
  .auth-nav-modal-msg.ok { color: #8ed8a3; }

  .auth-nav-code-row {
    display: flex; gap: 8px; justify-content: center;
    margin: 16px 0 12px;
  }
  .auth-nav-code-input {
    width: 40px; height: 48px;
    text-align: center; font-size: 22px; font-weight: 600;
    background: #0e0e0e; color: #fff;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;
    box-sizing: border-box;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .auth-nav-code-input:focus {
    outline: none; border-color: #ebb85e;
    background: rgba(235,184,94,0.06);
  }
  .auth-nav-code-actions {
    display: flex; justify-content: space-between;
    font-size: 12px; margin-top: 8px;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .auth-nav-link {
    background: none; border: 0; padding: 0;
    color: rgba(255,255,255,0.7); cursor: pointer; font: inherit;
    text-decoration: none;
  }
  .auth-nav-link:hover { color: #ebb85e; text-decoration: underline; }
  .auth-nav-link[disabled] {
    color: rgba(255,255,255,0.3); cursor: not-allowed; text-decoration: none;
  }

  @media (max-width: 480px) {
    .auth-nav-code-input { width: 36px; height: 44px; font-size: 20px; }
  }
</style>

<script src="{{ site.baseurl }}/assets/js/auth-nav.js" defer></script>
