<div class="fc-item" data-title="{{ include.section.title }}">
  <div class="cell cell-container middle">
    <div class="container">
      <div class="testimonials testimonials-5b1f7b2a9f306">
        {% for item in include.section.items %}
        <div class="testimonial-item">
          <div class="avatar">
            <div class="nav">
              <div class="prev solid-arrow-collection-left-chevron-1"></div>
              <div class="next solid-arrow-collection-right-chevron-1"></div>
            </div>
            <div class="img" style="background-image: url({{ item.avatar }});"></div>
          </div>
          <div class="quote">{{ item.quote }}</div>
          <div class="bottom">
            <h6>{{ item.author }}</h6>
            <div class="post">{{ item.role }}</div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
