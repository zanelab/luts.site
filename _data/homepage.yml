  - type: vision
    title: "我的愿景"
    camera_image: /assets/images/2018/06/camera-img.png
    content: "我发现手机摄影最大的痛点不是设备，而是色彩。网上其实有很多免费的LUT资源，但分散在各个论坛、网盘、外文网站，质量参差不齐，很多根本不适配手机软件，套上去要么过曝、要么肤色奇怪。于是我花大量时间从各个渠道收集、筛选、实测，只留下那些真正适合手机视频的.cube文件，并按风格分类。同时，我会为每一款LUT配上详细的导入教程和微调建议 —— 从剪映到VN，从LumaFusion到Lightroom Mobile。这个网站的定位很简单：做你手机调色的“精选超市 + 说明书”。你不用再去海量资源里大海捞针，也不用自己摸索怎么用。所有LUT和教程，我整理好了。"
    button_text: "跟我一起玩"
    button_url: "#"

