    bio: "本站分享的LUT预设均收集自公开网络渠道（如免费资源站、作者公开分享等），部分无法追溯原作者。如果你发现你的作品被收录且不希望被分享，请联系我，我会立即下架。我的初衷仅是整理、测试与教学。"
